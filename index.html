<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>moomin-cve</title>
<meta name="description" content="매일 아침 정리하는 CVE 브리핑 기록">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{--bg:#fafaf9;--fg:#1c1917;--mut:#78716c;--line:#e7e5e4;--card:#fff;
    --red:#dc2626;--org:#ea580c;--grn:#16a34a;--gry:#a8a29e;}
  @media (prefers-color-scheme:dark){:root{--bg:#1c1917;--fg:#f5f5f4;--mut:#a8a29e;--line:#3f3a36;--card:#292524;}}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
    padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left));z-index:2}
  .hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  h1{font-size:18px;margin:0 0 8px}
  .upd{font-size:12px;color:var(--mut)}
  .bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  input[type=search]{flex:1;min-width:160px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
  .chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  main{padding:8px calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));max-width:860px;margin:0 auto}
  .day{margin-top:18px}
  .day h2{font-size:14px;color:var(--mut);margin:0 0 6px;font-weight:600}
  .note{font-size:13px;color:var(--mut);margin:0 0 8px}
  .item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gry);border-radius:8px;padding:10px 12px;margin-bottom:8px}
  .item.red{border-left-color:var(--red)}.item.orange{border-left-color:var(--org)}.item.green{border-left-color:var(--grn)}
  .top{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .id{font-weight:700;font-family:ui-monospace,Consolas,monospace;font-size:14px}
  .tag{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--mut)}
  .tag.kev{color:var(--red);border-color:var(--red)}.tag.poc{color:var(--org);border-color:var(--org)}
  .prod{font-size:13px;color:var(--mut)}
  .ttl{font-weight:600;margin-top:2px}
  .sum{margin:4px 0 0;font-size:14px}
  .hist{margin:6px 0 0;font-size:12px;color:var(--mut)}
  .tags{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
  .tags button{font:inherit;font-size:11px;background:none;border:none;color:var(--mut);padding:0;cursor:pointer}
  a{color:inherit}
  .links{font-size:12px;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
  .empty{color:var(--mut);text-align:center;padding:40px 0}
  .stats{font-size:12px;color:var(--mut);margin-top:6px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gry);margin-right:5px;vertical-align:1px}
  .dot.red{background:var(--red)}.dot.orange{background:var(--org)}.dot.green{background:var(--grn)}
  .item .dot{align-self:center;margin-right:0}
  .off{display:none;font-size:12px;color:var(--org);margin-top:4px}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>moomin-cve</h1><span class="upd" id="upd"></span></div>
  <div class="bar"><input type="search" id="q" placeholder="CVE, 제품, 태그 검색"></div>
  <div class="bar" style="margin-top:6px" id="grades">
    <button class="chip on" data-g="all">전체</button>
    <button class="chip" data-g="red"><span class="dot red"></span>즉시 확인</button>
    <button class="chip" data-g="orange"><span class="dot orange"></span>주의</button>
    <button class="chip" data-g="green"><span class="dot green"></span>흥미</button>
    <button class="chip" data-g="gray"><span class="dot gray"></span>과장 체크</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="off" id="off">오프라인: 저장된 데이터를 보여주는 중</div>
</header>
<main id="list"><div class="empty">불러오는 중…</div></main>
<script>
const GN={red:"즉시 확인",orange:"주의",green:"흥미",gray:"과장 체크"};
const dot=g=>`<span class="dot ${g}" aria-label="${GN[g]||""}"></span>`;
const ORD={red:0,orange:1,green:2,gray:3};
let items=[],runs={},grade="all",q="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//.test(u||"")?u:null;

function render(){
  const f=items.filter(it=>{
    if(grade!=="all"&&it.grade!==grade)return false;
    if(!q)return true;
    return [it.cve,it.title,it.product,it.summary,(it.tags||[]).join(" ")].join(" ").toLowerCase().includes(q);
  });
  const c={red:0,orange:0,green:0,gray:0};items.forEach(i=>i.grade in c&&c[i.grade]++);
  $("#stats").innerHTML=`총 ${items.length}건 · ${dot("red")}${c.red} ${dot("orange")}${c.orange} ${dot("green")}${c.green} ${dot("gray")}${c.gray}`;
  const byDay={};f.forEach(it=>{(byDay[it.date]=byDay[it.date]||[]).push(it)});
  const days=Object.keys(byDay).sort().reverse();
  if(!days.length){$("#list").innerHTML=`<div class="empty">${items.length?"조건에 맞는 항목이 없어.":"아직 기록이 없어."}</div>`;return;}
  $("#list").innerHTML=days.map(d=>{
    const r=runs[d];
    const rows=byDay[d].sort((a,b)=>(ORD[a.grade]??9)-(ORD[b.grade]??9)).map(it=>{
      const links=(it.links||[]).map(l=>{const u=safeUrl(l.url);return u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l.label||"링크")}</a>`:""}).join("");
      const hist=(it.history||[]).map(h=>`${esc(h.date)}: ${esc(h.note)}`).join(" · ");
      const tags=(it.tags||[]).map(t=>`<button data-tag="${esc(t)}">#${esc(t)}</button>`).join("");
      return `<div class="item ${esc(it.grade)}">
        <div class="top">${it.grade in GN?dot(it.grade):""}<span class="id">${esc(it.cve)}</span>
          ${it.kev?'<span class="tag kev">KEV</span>':""}${it.poc?'<span class="tag poc">PoC</span>':""}
          ${it.cvss!=null?`<span class="tag">CVSS ${esc(it.cvss)}</span>`:""}
          ${it.deepDive?`<span class="tag">심층 ${esc(it.deepDive)}</span>`:""}</div>
        <div class="prod">${esc(it.product)}</div>
        ${it.title?`<div class="ttl">${esc(it.title)}</div>`:""}
        <p class="sum">${esc(it.summary)}</p>
        ${hist?`<p class="hist">변화: ${hist}</p>`:""}
        ${links?`<div class="links">${links}</div>`:""}
        ${tags?`<div class="tags">${tags}</div>`:""}
      </div>`}).join("");
    return `<section class="day"><h2>${esc(d)}</h2>${r&&r.note?`<p class="note">${esc(r.note)}</p>`:""}${rows}</section>`;
  }).join("");
}

$("#q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();render()});
$("#grades").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;
  grade=b.dataset.g;document.querySelectorAll("#grades .chip").forEach(x=>x.classList.toggle("on",x===b));render()});
$("#list").addEventListener("click",e=>{const t=e.target.closest("[data-tag]");if(!t)return;
  $("#q").value=t.dataset.tag;q=t.dataset.tag.toLowerCase();render();window.scrollTo({top:0})});

async function load(){
  try{
    const [a,b]=await Promise.all([fetch("data/cves.json",{cache:"no-cache"}),fetch("data/runs.json",{cache:"no-cache"})]);
    if(!a.ok)throw new Error(a.status);
    items=await a.json();
    runs={};(b.ok?await b.json():[]).forEach(r=>runs[r.date]=r);
    const last=Object.keys(runs).sort().pop();
    $("#upd").textContent=last?`마지막 실행 ${last}`:"";
    $("#off").style.display=navigator.onLine?"none":"block";
    render();
  }catch(err){$("#list").innerHTML='<div class="empty">데이터를 불러오지 못했어.</div>';}
}
load();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
